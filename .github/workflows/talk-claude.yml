# AI三者トーク：Claude担当（段階2：海未＋ChatGPT＋Claude）
# 呼び鈴（このリポジトリ）へのコミットで起動し、Claudeの番のときだけ返事を書く。
name: talk-claude

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # 本人が手動で1回だけ動かすとき
  # 1時間ごとの確認：半日止まっていたら話題を出す（Claudeの番のとき）＋返事の取りこぼしの保険
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write              # SIGNAL.md のコミットに使う
  issues: write                # ChatGPT宛ての合図（Issueへのコメント）に使う

concurrency:
  group: talk-claude           # 同時に2つ動かない（二重返信の防止）
  cancel-in-progress: false

env:
  TALK_PAGE_ID: 4161ffb21f0b81acba21e332ddd986e0   # 💬 AI同士のトーク
  PARTICIPANTS: MUSE,ChatGPT,Claude   # 段階1に戻すときは MUSE,Claude
  MAX_TURNS: "30"              # 安全のための上限（3人が納得【合意】すれば、その前に終わる）
  IDLE_HOURS: "12"             # この時間だれも書かなければ、話題を出す番の者が新しい話題を出す
  BELL_ISSUE: "1"              # ChatGPT宛ての合図を書くIssueの番号

jobs:
  reply:
    # Claude自身のコミットには反応しない（GITHUB_TOKENのコミットはもともと起動しないが念のため）
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'bell: Claude')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notify ChatGPT if it is ChatGPT's turn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/talk_bot.py notify

      - name: Check whose turn it is
        id: check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/talk_bot.py prepare --out work

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Ask Claude (no Notion token)
        if: steps.check.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ steps.check.outputs.mode }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          if [ "$MODE" = "topic" ]; then
            # 話題出しのときだけ、ウェブ検索を許可する
            claude -p --max-turns 8 --output-format text \
              --allowedTools "WebSearch,WebFetch" \
              --disallowedTools "Bash,Read,Write,Edit,MultiEdit,NotebookEdit,Glob,Grep,Task" \
              < work/prompt.txt > work/reply.txt 2>/dev/null
          else
            claude -p --max-turns 1 --output-format text \
              --disallowedTools "Bash,Read,Write,Edit,MultiEdit,NotebookEdit,Glob,Grep,WebFetch,WebSearch,Task" \
              < work/prompt.txt > work/reply.txt 2>/dev/null
          fi
          echo "mode: $MODE / reply chars: $(wc -m < work/reply.txt)"   # 中身は出さない

      - name: Post to Notion and update SIGNAL.md
        id: post
        if: steps.check.outputs.run == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/talk_bot.py post --work work

      - name: Ring the bell
        if: steps.post.outputs.posted == 'true'
        run: |
          git config user.name  "claude-talk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SIGNAL.md
          git commit -m "bell: Claude -> ${{ steps.post.outputs.next }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Clean up
        if: always()
        run: rm -rf work
